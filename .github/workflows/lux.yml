# Save as .github/workflows/lux.yml in your GitHub repo
name: Outdoor light lamp trigger

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs a little)
  workflow_dispatch:         # lets you click "Run workflow" to test manually

jobs:
  check-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check outdoor light and trigger Alexa
        env:
          LIGHTS_ON_URL: ${{ secrets.LIGHTS_ON_URL }}
          LIGHTS_OFF_URL: ${{ secrets.LIGHTS_OFF_URL }}
        run: python lux_trigger.py
